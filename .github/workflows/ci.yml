name: client-ci

on:
  workflow_dispatch:
  push:
    branches: [ "develop-v2" ]
  pull_request:
    branches: [ "develop-v2" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npx ng build --configuration production

      # NOTE: there are currently 0 *.spec.ts unit specs, so there is nothing for
      # `ng test` to run (it would be a no-op / "no specs found"). When unit specs
      # are added, enable the step below — ubuntu-latest ships Chrome; the
      # --no-sandbox launcher is required because CI runs as root:
      #
      # - name: Unit tests
      #   run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
      #
      # The real frontend tests are Playwright E2E (playwright.config.ts); they need
      # the full FE+BE stack running and are tracked as a CI follow-up.
