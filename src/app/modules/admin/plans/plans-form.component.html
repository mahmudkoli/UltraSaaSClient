<app-list-page
    [title]="isEdit ? 'Edit Plan' : 'New Plan'"
    [subtitle]="isEdit ? 'Update plan details. Code is immutable.' : 'Add a new subscription tier.'"
    icon="layers"
    iconGradient="from-violet-500 to-fuchsia-600"
    pageGradient="from-gray-50 via-violet-50/30 to-fuchsia-50/30">

    <div pageActions class="flex flex-col w-full sm:w-auto sm:flex-row sm:items-center sm:justify-end gap-3">
        <button mat-stroked-button (click)="cancel()">
            <mat-icon class="mr-2">arrow_back</mat-icon>
            Back
        </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-6 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Code</mat-label>
                <input matInput formControlName="code" placeholder="starter / pro / free">
                <mat-hint>Lowercase, alphanumeric + - or _. Immutable.</mat-hint>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Display Name</mat-label>
                <input matInput formControlName="name" placeholder="Starter">
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Monthly Fee (BDT)</mat-label>
                <input matInput type="number" formControlName="monthlyFeeBDT" min="0">
                <span matSuffix class="pr-2 text-gray-500">BDT</span>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Trial Days</mat-label>
                <input matInput type="number" formControlName="trialDays" min="0">
                <mat-hint>0 for paid-from-day-one plans.</mat-hint>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Max Institutes</mat-label>
                <input matInput type="number" formControlName="maxInstitutes" min="1">
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Max Users</mat-label>
                <input matInput type="number" formControlName="maxUsers" min="1">
            </mat-form-field>
        </div>

        <!-- Phase v1-K6 — known feature flags as a checklist. Raw JSON
             still flows through featureFlagsJson FormControl unchanged. -->
        <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-3">
            <div class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Feature flags</div>
            <div class="space-y-1">
                <mat-checkbox *ngFor="let f of knownFlags" [checked]="hasFlag(f.code)" (change)="setFlag(f.code, $event.checked)">
                    <span class="text-sm font-medium">{{ f.code }}</span>
                    <span class="text-xs text-gray-500 ml-2">{{ f.description }}</span>
                </mat-checkbox>
            </div>
            <div class="text-xs text-gray-400 mt-2">Stored as: <code>{{ form.value.featureFlagsJson }}</code></div>
        </div>

        <div *ngIf="isEdit">
            <mat-checkbox formControlName="isActive">Plan is active (visible to tenants picking a plan)</mat-checkbox>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200 dark:border-gray-700">
            <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">
                <mat-icon class="mr-2" *ngIf="!saving">save</mat-icon>
                {{ saving ? 'Saving…' : (isEdit ? 'Save Changes' : 'Create Plan') }}
            </button>
        </div>
    </form>
</app-list-page>
