<app-list-page
    title="Events"
    subtitle="Academic events, holidays, sports, workshops. Calendar widget is a follow-up — this is the master list."
    icon="event"
    iconGradient="from-pink-500 to-rose-600"
    pageGradient="from-gray-50 via-pink-50/30 to-rose-50/30">

    <div pageActions class="flex flex-col w-full sm:w-auto sm:flex-row sm:items-center sm:justify-end gap-3">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full sm:w-auto sm:min-w-72">
            <mat-label>Search</mat-label>
            <input matInput [formControl]="search">
            <mat-icon matSuffix class="text-gray-400">search</mat-icon>
        </mat-form-field>
        <button mat-fab color="primary" (click)="add()" matTooltip="New event"><mat-icon>add</mat-icon></button>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <table mat-table [dataSource]="rows" class="w-full">
            <ng-container matColumnDef="startDate"><th mat-header-cell *matHeaderCellDef>When</th><td mat-cell *matCellDef="let e" class="text-xs whitespace-nowrap">
                {{ e.startDate | date:'mediumDate' }}
                <span *ngIf="e.startDate !== e.endDate"> – {{ e.endDate | date:'mediumDate' }}</span>
            </td></ng-container>
            <ng-container matColumnDef="title"><th mat-header-cell *matHeaderCellDef>Title</th><td mat-cell *matCellDef="let e" class="font-medium">{{ e.title }}</td></ng-container>
            <ng-container matColumnDef="type"><th mat-header-cell *matHeaderCellDef>Type</th><td mat-cell *matCellDef="let e">
                <span class="inline-block px-2 py-0.5 rounded text-xs font-medium" [style.background]="e.color || '#e5e7eb'" [style.color]="e.color ? 'white' : '#374151'">{{ typeLabel(e.eventType) }}</span>
            </td></ng-container>
            <ng-container matColumnDef="location"><th mat-header-cell *matHeaderCellDef>Location</th><td mat-cell *matCellDef="let e" class="text-sm">{{ e.location || '—' }}</td></ng-container>
            <ng-container matColumnDef="recurring"><th mat-header-cell *matHeaderCellDef>Recurring</th><td mat-cell *matCellDef="let e" class="text-sm">{{ e.isRecurring ? e.recurrencePattern : '—' }}</td></ng-container>
            <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef class="!text-right">Actions</th><td mat-cell *matCellDef="let e" class="!text-right">
                <button mat-icon-button (click)="edit(e)" matTooltip="Edit"><mat-icon class="!w-5 !h-5 !text-base">edit</mat-icon></button>
                <button mat-icon-button color="warn" (click)="remove(e)" matTooltip="Delete"><mat-icon class="!w-5 !h-5 !text-base">delete</mat-icon></button>
            </td></ng-container>
            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let row; columns: cols"></tr>
        </table>
        <div *ngIf="rows.length === 0 && !loading" class="py-12 text-center text-sm text-gray-500">No events yet.</div>
        <mat-paginator [length]="total" [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50, 100]" (page)="onPage($event)"></mat-paginator>
    </div>
</app-list-page>
