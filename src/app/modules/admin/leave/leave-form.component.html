<app-list-page
    title="Apply for Leave"
    subtitle="Submit a leave request for review."
    icon="event_busy"
    iconGradient="from-amber-500 to-orange-600"
    pageGradient="from-gray-50 via-amber-50/30 to-orange-50/30">

    <div pageActions class="flex flex-col w-full sm:w-auto sm:flex-row sm:items-center sm:justify-end gap-3">
        <a mat-stroked-button routerLink="/leaves">
            <mat-icon class="mr-2">arrow_back</mat-icon>
            Back to list
        </a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Staff member</mat-label>
                    <mat-select formControlName="teacherId">
                        <mat-option *ngFor="let t of teachers" [value]="t.id">{{ t.firstName }} {{ t.lastName }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Leave type</mat-label>
                    <mat-select formControlName="type">
                        <mat-option *ngFor="let t of types" [value]="t">{{ t }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>From</mat-label>
                    <input matInput type="date" formControlName="fromDate">
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>To</mat-label>
                    <input matInput type="date" formControlName="toDate">
                </mat-form-field>
            </div>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Reason</mat-label>
                <textarea matInput formControlName="reason" rows="3" maxlength="500"></textarea>
                <mat-hint align="end">{{ form.controls['reason'].value?.length || 0 }} / 500</mat-hint>
            </mat-form-field>

            <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                <a mat-stroked-button routerLink="/leaves">Cancel</a>
                <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">
                    <mat-icon class="mr-1" *ngIf="!saving">send</mat-icon>
                    {{ saving ? 'Submitting…' : 'Submit Leave' }}
                </button>
            </div>
    </form>
</app-list-page>
