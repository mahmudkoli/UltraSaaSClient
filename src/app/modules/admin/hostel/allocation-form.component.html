<app-list-page
    [title]="editingId ? 'Edit allocation' : 'New allocation'"
    subtitle="Student → hostel room check-in / check-out."
    icon="meeting_room"
    iconGradient="from-amber-500 to-orange-600"
    pageGradient="from-gray-50 via-amber-50/30 to-orange-50/30">

    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-5 space-y-3">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <app-entity-picker
                label="Student"
                placeholder="Type a student's name"
                formControlName="studentId"
                [searchFn]="searchStudents"
                [displayFn]="displayStudent"
                [resolveFn]="resolveStudent"></app-entity-picker>
            <app-entity-picker
                label="Hostel"
                placeholder="Type a hostel name or code"
                formControlName="hostelId"
                [searchFn]="searchHostels"
                [displayFn]="displayHostel"
                [resolveFn]="resolveHostel"></app-entity-picker>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Room number</mat-label><input matInput formControlName="roomNumber"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Bed</mat-label><input matInput formControlName="bedNumber"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Floor</mat-label><input matInput formControlName="floor"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Block</mat-label><input matInput formControlName="block"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Check-in date</mat-label><input matInput type="date" formControlName="checkInDate"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Check-out date</mat-label><input matInput type="date" formControlName="checkOutDate"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Status</mat-label><mat-select formControlName="status"><mat-option *ngFor="let s of statuses" [value]="s.v">{{ s.l }}</mat-option></mat-select></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Monthly fee (BDT)</mat-label><input matInput type="number" formControlName="monthlyFee"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Emergency contact</mat-label><input matInput formControlName="emergencyContact"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Emergency phone</mat-label><input matInput formControlName="emergencyPhone"></mat-form-field>
        </div>
        <mat-form-field appearance="outline" class="w-full"><mat-label>Remarks</mat-label><input matInput formControlName="remarks"></mat-form-field>
        <mat-form-field appearance="outline" class="w-full" *ngIf="editingId"><mat-label>Check-out remarks</mat-label><input matInput formControlName="checkOutRemarks"></mat-form-field>
        <div class="flex justify-end gap-2 pt-2">
            <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : 'Save' }}</button>
        </div>
    </form>
</app-list-page>
