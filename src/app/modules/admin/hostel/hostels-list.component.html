<div class="flex flex-col flex-auto min-w-0 p-6">
    <div class="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between mb-6">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Hostels</h2>
            <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">Hostel buildings with occupancy + warden + monthly fee.</p>
        </div>
        <div class="flex gap-2 items-center">
            <mat-form-field appearance="outline" subscriptSizing="dynamic" class="sm:w-72">
                <mat-label>Search</mat-label><input matInput [formControl]="search"><mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
            <button mat-flat-button color="primary" (click)="add()"><mat-icon>add</mat-icon> New hostel</button>
            <a mat-stroked-button routerLink="/hostels/allocations">Allocations →</a>
        </div>
    </div>
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <table mat-table [dataSource]="rows" class="w-full">
            <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Name</th><td mat-cell *matCellDef="let h" class="font-medium">{{ h.name }}</td></ng-container>
            <ng-container matColumnDef="code"><th mat-header-cell *matHeaderCellDef>Code</th><td mat-cell *matCellDef="let h" class="text-xs font-mono">{{ h.code }}</td></ng-container>
            <ng-container matColumnDef="occupancy"><th mat-header-cell *matHeaderCellDef class="!text-right">Rooms</th><td mat-cell *matCellDef="let h" class="!text-right text-sm">{{ h.occupiedRooms }} / {{ h.totalRooms }}</td></ng-container>
            <ng-container matColumnDef="monthlyFee"><th mat-header-cell *matHeaderCellDef class="!text-right">Monthly fee</th><td mat-cell *matCellDef="let h" class="!text-right">BDT {{ h.monthlyFee | number:'1.0-0' }}</td></ng-container>
            <ng-container matColumnDef="warden"><th mat-header-cell *matHeaderCellDef>Warden</th><td mat-cell *matCellDef="let h" class="text-sm">{{ h.wardenName || '—' }}</td></ng-container>
            <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef class="!text-right">Actions</th><td mat-cell *matCellDef="let h" class="!text-right">
                <button mat-icon-button (click)="edit(h)" matTooltip="Edit"><mat-icon class="!w-5 !h-5 !text-base">edit</mat-icon></button>
                <button mat-icon-button color="warn" (click)="remove(h)" matTooltip="Delete"><mat-icon class="!w-5 !h-5 !text-base">delete</mat-icon></button>
            </td></ng-container>
            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let row; columns: cols"></tr>
        </table>
        <div *ngIf="rows.length === 0 && !loading" class="py-12 text-center text-sm text-gray-500">No hostels configured yet.</div>
        <mat-paginator [length]="total" [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50, 100]" (page)="onPage($event)"></mat-paginator>
    </div>
</div>
