<h2 mat-dialog-title class="!flex !items-center !gap-2">
    <mat-icon class="text-primary">payments</mat-icon>
    Record Payment — {{ data.tenantName }}
</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
    <mat-dialog-content class="!pt-2">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <mat-form-field>
                <mat-label>Amount (BDT)</mat-label>
                <input matInput type="number" formControlName="amount" min="1">
                <span matSuffix class="pr-2 text-gray-500">BDT</span>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Method</mat-label>
                <mat-select formControlName="method">
                    <mat-option value="Bkash">bKash</mat-option>
                    <mat-option value="Nagad">Nagad</mat-option>
                    <mat-option value="BankTransfer">Bank Transfer</mat-option>
                    <mat-option value="Cash">Cash</mat-option>
                    <mat-option value="Cheque">Cheque</mat-option>
                    <mat-option value="Other">Other</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Paid On</mat-label>
                <input matInput type="date" formControlName="paidOn">
            </mat-form-field>

            <mat-form-field>
                <mat-label>Reference / Txn ID</mat-label>
                <input matInput formControlName="reference" placeholder="bKash TrxID, cheque #, etc.">
            </mat-form-field>

            <mat-form-field>
                <mat-label>Billing Period — Start</mat-label>
                <input matInput type="date" formControlName="periodStart">
            </mat-form-field>

            <mat-form-field>
                <mat-label>Billing Period — End</mat-label>
                <input matInput type="date" formControlName="periodEnd">
                <mat-hint>Tenant ValidUpto is set to this date (if newer).</mat-hint>
            </mat-form-field>

            <mat-form-field class="md:col-span-2">
                <mat-label>Notes</mat-label>
                <textarea matInput formControlName="notes" rows="2"></textarea>
            </mat-form-field>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
            <mat-icon class="mr-1">check</mat-icon>
            Record Payment
        </button>
    </mat-dialog-actions>
</form>
