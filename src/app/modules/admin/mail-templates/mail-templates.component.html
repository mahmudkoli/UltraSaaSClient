<app-list-page
    title="Mail Templates"
    subtitle="Reusable email message bodies. Used by lifecycle emails + custom broadcasts."
    icon="mail"
    iconGradient="from-blue-500 to-indigo-600"
    pageGradient="from-gray-50 via-blue-50/30 to-indigo-50/30">

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-5">
            <h3 class="text-lg font-semibold mb-3">{{ editingId ? 'Edit template' : 'New template' }}</h3>
            <form [formGroup]="form" (ngSubmit)="save()" class="space-y-2">
                <mat-form-field appearance="outline" class="w-full"><mat-label>Title</mat-label><input matInput formControlName="title"></mat-form-field>
                <mat-form-field appearance="outline" class="w-full"><mat-label>Subject</mat-label><input matInput formControlName="subject"></mat-form-field>
                <mat-form-field appearance="outline" class="w-full"><mat-label>Body (HTML or text)</mat-label><textarea matInput formControlName="body" rows="8"></textarea></mat-form-field>
                <div class="flex gap-2 pt-2">
                    <button mat-stroked-button type="button" (click)="reset()">Reset</button>
                    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : (editingId ? 'Save' : 'Add') }}</button>
                </div>
            </form>
        </div>
        <div class="lg:col-span-2 bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
            <div class="relative overflow-x-auto">
            <table mat-table [dataSource]="rows" class="w-full">

                <!-- Icon -->
                <ng-container matColumnDef="icon">
                    <th mat-header-cell *matHeaderCellDef class="pl-4 sm:pl-6"></th>
                    <td mat-cell *matCellDef="let t" class="pl-4 sm:pl-6">
                        <div class="flex-shrink-0 h-10 w-10 rounded-full bg-gradient-to-br from-blue-100 to-indigo-200 dark:from-blue-900 dark:to-indigo-800 flex items-center justify-center ring-2 ring-gray-200 dark:ring-gray-600 shadow-md">
                            <mat-icon class="icon-size-5 text-blue-600 dark:text-blue-300">mail</mat-icon>
                        </div>
                    </td>
                </ng-container>

                <!-- Title + subject -->
                <ng-container matColumnDef="title">
                    <th mat-header-cell *matHeaderCellDef>Template</th>
                    <td mat-cell *matCellDef="let t">
                        <div class="flex flex-col">
                            <span class="text-sm font-medium text-gray-900 dark:text-white">{{ t.title }}</span>
                            <span class="text-xs text-gray-500">{{ t.subject }}</span>
                        </div>
                    </td>
                </ng-container>

                <!-- Actions -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef class="pr-4 sm:pr-6 !text-right">Actions</th>
                    <td mat-cell *matCellDef="let t" class="pr-4 sm:pr-6">
                        <div class="flex items-center justify-end space-x-2">
                            <button mat-icon-button (click)="edit(t)" matTooltip="Edit"
                                    class="text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-full transition-all duration-200">
                                <mat-icon class="icon-size-5">edit</mat-icon>
                            </button>
                            <button mat-icon-button (click)="remove(t)" matTooltip="Delete"
                                    class="text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-full transition-all duration-200">
                                <mat-icon class="icon-size-5">delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="cols" class="bg-gray-50 dark:bg-gray-700 sticky top-0 z-10"></tr>
                <tr mat-row *matRowDef="let row; columns: cols"
                    class="hover:bg-blue-50 dark:hover:bg-blue-900/10 transition-all duration-300 border-b border-gray-100 dark:border-gray-700"></tr>
            </table>
            </div>
            <div *ngIf="rows.length === 0 && !loading" class="py-12 text-center text-sm text-gray-500">No mail templates yet.</div>
        </div>
    </div>
</app-list-page>
