<div class="flex flex-col flex-auto min-w-0">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 flex-0 sm:items-center sm:justify-between p-6 sm:py-4 sm:px-6 border-b bg-card">
        <div class="flex items-center space-x-4">
            <div class="flex items-center justify-center w-10 h-10 bg-primary rounded-lg">
                <mat-icon class="text-white" [svgIcon]="'heroicons_outline:paint-brush'"></mat-icon>
            </div>
            <div>
                <h2 class="text-2xl font-bold tracking-tight">Theme Settings</h2>
                <p class="text-sm text-secondary">Configure the appearance for tenant: <strong>{{ tenantId }}</strong></p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button mat-stroked-button [routerLink]="'/tenant'">
                <mat-icon [svgIcon]="'heroicons_outline:arrow-left'"></mat-icon>
                <span class="ml-2">Back</span>
            </button>
            <button mat-stroked-button color="warn" (click)="resetToDefault()">
                <mat-icon [svgIcon]="'heroicons_outline:arrow-path'"></mat-icon>
                <span class="ml-2">Reset to Default</span>
            </button>

            <!-- Preview / Back to Current toggle -->
            <button *ngIf="!isPreviewing" mat-stroked-button color="accent" (click)="preview()">
                <mat-icon>visibility</mat-icon>
                <span class="ml-2">Preview</span>
            </button>
            <button *ngIf="isPreviewing" mat-stroked-button (click)="backToCurrent()">
                <mat-icon>undo</mat-icon>
                <span class="ml-2">Back to Current</span>
            </button>

            <button mat-flat-button color="primary" (click)="save()" [disabled]="isSaving">
                <mat-icon *ngIf="!isSaving" [svgIcon]="'heroicons_outline:check'"></mat-icon>
                <mat-progress-spinner *ngIf="isSaving" [diameter]="20" [mode]="'indeterminate'"></mat-progress-spinner>
                <span class="ml-2">Save</span>
            </button>
        </div>
    </div>

    <!-- Preview banner -->
    <div *ngIf="isPreviewing" class="flex items-center justify-center gap-3 px-4 py-2 bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 text-sm font-medium">
        <mat-icon class="icon-size-5">visibility</mat-icon>
        <span>Previewing theme for <strong>{{ tenantId }}</strong> &mdash; this is temporary</span>
        <button mat-stroked-button class="ml-2 h-7 min-h-7 text-xs" (click)="backToCurrent()">
            Back to Current
        </button>
    </div>

    <!-- Content -->
    <div class="flex flex-col flex-auto p-6 md:p-8">

        <!-- Success alert -->
        <fuse-alert
            class="mb-6"
            *ngIf="showSuccess"
            [appearance]="'outline'"
            [type]="'success'"
            [dismissible]="true"
            (dismissed)="showSuccess = false">
            Theme settings saved successfully. All users will see the updated theme.
        </fuse-alert>

        <!-- Theme Color -->
        <div class="bg-card rounded-2xl shadow p-6 mb-6">
            <div class="text-lg font-semibold mb-4">Color Theme</div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <ng-container *ngFor="let theme of themes">
                    <div
                        class="flex items-center justify-center px-4 py-3 rounded-full cursor-pointer ring-inset ring-primary bg-hover transition-all"
                        [class.ring-2]="selectedTheme === theme.id"
                        [ngClass]="theme.id"
                        (click)="selectTheme(theme.id)">
                        <div class="flex-0 w-3 h-3 rounded-full bg-primary"></div>
                        <div class="ml-2.5 font-medium leading-5 truncate"
                            [class.text-secondary]="selectedTheme !== theme.id">
                            {{theme.name}}
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>

        <!-- Scheme -->
        <div class="bg-card rounded-2xl shadow p-6 mb-6">
            <div class="text-lg font-semibold mb-4">Color Scheme</div>
            <div class="grid grid-cols-3 gap-3">
                <div
                    class="flex items-center py-3 pl-5 pr-6 rounded-full cursor-pointer ring-inset ring-primary bg-hover transition-all"
                    [class.ring-2]="selectedScheme === 'auto'"
                    (click)="selectScheme('auto')">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:bolt'"></mat-icon>
                    <div class="flex items-center ml-2 font-medium leading-5"
                        [class.text-secondary]="selectedScheme !== 'auto'">Auto</div>
                </div>
                <div
                    class="flex items-center py-3 pl-5 pr-6 rounded-full cursor-pointer ring-inset ring-primary bg-hover transition-all"
                    [class.ring-2]="selectedScheme === 'dark'"
                    (click)="selectScheme('dark')">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:moon'"></mat-icon>
                    <div class="flex items-center ml-2 font-medium leading-5"
                        [class.text-secondary]="selectedScheme !== 'dark'">Dark</div>
                </div>
                <div
                    class="flex items-center py-3 pl-5 pr-6 rounded-full cursor-pointer ring-inset ring-primary bg-hover transition-all"
                    [class.ring-2]="selectedScheme === 'light'"
                    (click)="selectScheme('light')">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:sun'"></mat-icon>
                    <div class="flex items-center ml-2 font-medium leading-5"
                        [class.text-secondary]="selectedScheme !== 'light'">Light</div>
                </div>
            </div>
        </div>

        <!-- Layout -->
        <div class="bg-card rounded-2xl shadow p-6">
            <div class="text-lg font-semibold mb-4">Layout</div>
            <div class="grid grid-cols-3 sm:grid-cols-4 gap-4">
                <div *ngFor="let layout of layouts"
                    class="flex flex-col cursor-pointer"
                    (click)="selectLayout(layout.id)">
                    <div class="flex h-20 rounded-md overflow-hidden border-2 hover:opacity-80 transition-all"
                        [class.border-primary]="selectedLayout === layout.id"
                        [class.border-transparent]="selectedLayout !== layout.id">
                        <div class="flex flex-auto bg-gray-50 dark:bg-gray-900 items-center justify-center">
                            <mat-icon class="text-hint icon-size-6" [svgIcon]="layout.icon"></mat-icon>
                        </div>
                    </div>
                    <div class="mt-2 text-md font-medium text-center"
                        [class.text-primary]="selectedLayout === layout.id"
                        [class.text-secondary]="selectedLayout !== layout.id">
                        {{layout.name}}
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
