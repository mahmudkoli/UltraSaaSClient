<app-list-page
    title="Mail Logs"
    subtitle="Read-only audit of every email the platform attempted to send (success + failure)."
    icon="all_inbox"
    iconGradient="from-blue-500 to-indigo-600"
    pageGradient="from-gray-50 via-blue-50/30 to-indigo-50/30">

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <table mat-table [dataSource]="rows" class="w-full">
            <ng-container matColumnDef="schedule"><th mat-header-cell *matHeaderCellDef class="whitespace-nowrap">Scheduled</th><td mat-cell *matCellDef="let r" class="whitespace-nowrap text-xs">{{ r.schedule ? (r.schedule | date:'short') : '—' }}</td></ng-container>
            <ng-container matColumnDef="to"><th mat-header-cell *matHeaderCellDef>To</th><td mat-cell *matCellDef="let r" class="text-sm">{{ r.to }}</td></ng-container>
            <ng-container matColumnDef="subject"><th mat-header-cell *matHeaderCellDef>Subject</th><td mat-cell *matCellDef="let r" class="text-sm">{{ truncate(r.subject) }}</td></ng-container>
            <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let r">
                <span *ngIf="r.isSuccess" class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800">Sent</span>
                <span *ngIf="!r.isSuccess" class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800" [title]="r.failReason">Failed</span>
            </td></ng-container>
            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let row; columns: cols"></tr>
        </table>
        <div *ngIf="rows.length === 0 && !loading" class="py-12 text-center text-sm text-gray-500">No emails have been sent yet.</div>
        <mat-paginator [length]="total" [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50, 100]" (page)="onPage($event)"></mat-paginator>
    </div>
</app-list-page>
