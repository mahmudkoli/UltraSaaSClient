<app-list-page
    title="Transport — Routes"
    subtitle="Bus routes with start / end / distance / fare."
    icon="route"
    iconGradient="from-sky-500 to-cyan-600"
    pageGradient="from-gray-50 via-sky-50/30 to-cyan-50/30">

    <div pageActions class="flex flex-col w-full sm:w-auto sm:flex-row sm:items-center sm:justify-end gap-3">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full sm:w-auto sm:min-w-72">
            <mat-label>Search</mat-label>
            <input matInput [formControl]="search">
            <mat-icon matSuffix class="text-gray-400">search</mat-icon>
        </mat-form-field>
        <a mat-stroked-button routerLink="/transport/vehicles" matTooltip="Fleet inventory">Vehicles &rarr;</a>
        <a mat-stroked-button routerLink="/transport/assignments" matTooltip="Student pickups">Assignments &rarr;</a>
        <button mat-fab color="primary" (click)="add()" matTooltip="New route"><mat-icon>add</mat-icon></button>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <table mat-table [dataSource]="rows" class="w-full">
            <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Name</th><td mat-cell *matCellDef="let r" class="font-medium">{{ r.name }}</td></ng-container>
            <ng-container matColumnDef="code"><th mat-header-cell *matHeaderCellDef>Code</th><td mat-cell *matCellDef="let r" class="text-xs font-mono">{{ r.code }}</td></ng-container>
            <ng-container matColumnDef="start"><th mat-header-cell *matHeaderCellDef>Start</th><td mat-cell *matCellDef="let r" class="text-sm">{{ r.startLocation }}</td></ng-container>
            <ng-container matColumnDef="end"><th mat-header-cell *matHeaderCellDef>End</th><td mat-cell *matCellDef="let r" class="text-sm">{{ r.endLocation }}</td></ng-container>
            <ng-container matColumnDef="distance"><th mat-header-cell *matHeaderCellDef class="!text-right">Distance</th><td mat-cell *matCellDef="let r" class="!text-right text-sm">{{ r.distance | number:'1.0-2' }} km</td></ng-container>
            <ng-container matColumnDef="fare"><th mat-header-cell *matHeaderCellDef class="!text-right">Fare</th><td mat-cell *matCellDef="let r" class="!text-right">{{ r.fare | tenantCurrency:undefined:0 }}</td></ng-container>
            <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef class="!text-right">Actions</th><td mat-cell *matCellDef="let r" class="!text-right">
                <button mat-icon-button (click)="edit(r)" matTooltip="Edit"><mat-icon class="!w-5 !h-5 !text-base">edit</mat-icon></button>
                <button mat-icon-button color="warn" (click)="remove(r)" matTooltip="Delete"><mat-icon class="!w-5 !h-5 !text-base">delete</mat-icon></button>
            </td></ng-container>
            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let row; columns: cols"></tr>
        </table>
        <div *ngIf="rows.length === 0 && !loading" class="py-12 text-center text-sm text-gray-500">No routes configured yet.</div>
        <mat-paginator [length]="total" [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50, 100]" (page)="onPage($event)"></mat-paginator>
    </div>
</app-list-page>
