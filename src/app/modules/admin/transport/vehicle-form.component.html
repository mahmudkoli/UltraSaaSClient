<app-list-page
    [title]="editingId ? 'Edit vehicle' : 'New vehicle'"
    subtitle="Fleet entry: make / model / capacity / driver / insurance + fitness expiry."
    icon="directions_bus"
    iconGradient="from-sky-500 to-cyan-600"
    pageGradient="from-gray-50 via-sky-50/30 to-cyan-50/30">

    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-5 space-y-3">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <mat-form-field appearance="outline" class="w-full"><mat-label>Vehicle number</mat-label><input matInput formControlName="vehicleNumber"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Type</mat-label><input matInput formControlName="vehicleType"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Make</mat-label><input matInput formControlName="make"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Model</mat-label><input matInput formControlName="model"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Year</mat-label><input matInput type="number" formControlName="year"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Capacity</mat-label><input matInput type="number" formControlName="capacity"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Colour</mat-label><input matInput formControlName="color"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Registration number</mat-label><input matInput formControlName="registrationNumber"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Insurance number</mat-label><input matInput formControlName="insuranceNumber"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Insurance expiry</mat-label><input matInput type="date" formControlName="insuranceExpiryDate"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Fitness expiry</mat-label><input matInput type="date" formControlName="fitnessExpiryDate"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Driver name</mat-label><input matInput formControlName="driverName"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Driver phone</mat-label><input matInput formControlName="driverPhone"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Conductor name</mat-label><input matInput formControlName="conductorName"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Conductor phone</mat-label><input matInput formControlName="conductorPhone"></mat-form-field>
        </div>
        <mat-form-field appearance="outline" class="w-full"><mat-label>Remarks</mat-label><input matInput formControlName="remarks"></mat-form-field>
        <mat-checkbox formControlName="isActive">Active</mat-checkbox>
        <div class="flex justify-end gap-2 pt-2">
            <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : 'Save' }}</button>
        </div>
    </form>
</app-list-page>
