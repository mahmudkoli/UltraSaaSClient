<div class="flex flex-col flex-auto min-w-0 p-6 max-w-3xl">
    <div class="mb-6"><h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">{{ editingId ? 'Edit route' : 'New route' }}</h2></div>
    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 space-y-3">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <mat-form-field><mat-label>Name</mat-label><input matInput formControlName="name"></mat-form-field>
            <mat-form-field><mat-label>Code</mat-label><input matInput formControlName="code"></mat-form-field>
            <mat-form-field><mat-label>Start location</mat-label><input matInput formControlName="startLocation"></mat-form-field>
            <mat-form-field><mat-label>End location</mat-label><input matInput formControlName="endLocation"></mat-form-field>
            <mat-form-field><mat-label>Distance (km)</mat-label><input matInput type="number" formControlName="distance" step="0.1"></mat-form-field>
            <mat-form-field><mat-label>Estimated time (hh:mm:ss)</mat-label><input matInput formControlName="estimatedTime" placeholder="00:30:00"></mat-form-field>
            <mat-form-field><mat-label>Fare (BDT)</mat-label><input matInput type="number" formControlName="fare"></mat-form-field>
        </div>
        <mat-form-field class="w-full"><mat-label>Description</mat-label><textarea matInput formControlName="description" rows="2"></textarea></mat-form-field>
        <mat-form-field class="w-full"><mat-label>Stops (JSON or text)</mat-label><textarea matInput formControlName="stops" rows="2"></textarea></mat-form-field>
        <mat-form-field class="w-full"><mat-label>Remarks</mat-label><input matInput formControlName="remarks"></mat-form-field>
        <mat-checkbox formControlName="isActive">Active</mat-checkbox>
        <div class="flex justify-end gap-2 pt-2">
            <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : 'Save' }}</button>
        </div>
    </form>
</div>
