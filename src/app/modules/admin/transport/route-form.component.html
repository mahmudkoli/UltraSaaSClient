<app-list-page
    [title]="editingId ? 'Edit route' : 'New route'"
    subtitle="Bus route: start / end / distance / estimated time / fare."
    icon="route"
    iconGradient="from-sky-500 to-cyan-600"
    pageGradient="from-gray-50 via-sky-50/30 to-cyan-50/30">

    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-5 space-y-3">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <mat-form-field appearance="outline" class="w-full"><mat-label>Name</mat-label><input matInput formControlName="name"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Code</mat-label><input matInput formControlName="code"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Start location</mat-label><input matInput formControlName="startLocation"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>End location</mat-label><input matInput formControlName="endLocation"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Distance (km)</mat-label><input matInput type="number" formControlName="distance" step="0.1"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Estimated time (hh:mm:ss)</mat-label><input matInput formControlName="estimatedTime" placeholder="00:30:00"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Fare</mat-label><input matInput type="number" formControlName="fare"><mat-hint>In your tenant's currency.</mat-hint></mat-form-field>
        </div>
        <mat-form-field appearance="outline" class="w-full"><mat-label>Description</mat-label><textarea matInput formControlName="description" rows="2"></textarea></mat-form-field>
        <mat-form-field appearance="outline" class="w-full"><mat-label>Stops (JSON or text)</mat-label><textarea matInput formControlName="stops" rows="2"></textarea></mat-form-field>
        <mat-form-field appearance="outline" class="w-full"><mat-label>Remarks</mat-label><input matInput formControlName="remarks"></mat-form-field>
        <mat-checkbox formControlName="isActive">Active</mat-checkbox>
        <div class="flex justify-end gap-2 pt-2">
            <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : 'Save' }}</button>
        </div>
    </form>
</app-list-page>
