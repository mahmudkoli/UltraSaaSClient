<app-list-page
    [title]="editingId ? 'Edit assignment' : 'New assignment'"
    subtitle="Student → route + vehicle + pickup / drop location and time."
    icon="commute"
    iconGradient="from-sky-500 to-cyan-600"
    pageGradient="from-gray-50 via-sky-50/30 to-cyan-50/30">

    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-5 space-y-3">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <app-entity-picker
                label="Student"
                placeholder="Student name or roll"
                formControlName="studentId"
                [searchFn]="searchStudents"
                [displayFn]="displayStudent"
                [resolveFn]="resolveStudent"></app-entity-picker>
            <app-entity-picker
                label="Route"
                placeholder="Route name / code"
                formControlName="routeId"
                [searchFn]="searchRoutes"
                [displayFn]="displayRoute"
                [resolveFn]="resolveRoute"></app-entity-picker>
            <app-entity-picker
                label="Vehicle (optional)"
                placeholder="Vehicle number"
                formControlName="vehicleId"
                [searchFn]="searchVehicles"
                [displayFn]="displayVehicle"
                [resolveFn]="resolveVehicle"></app-entity-picker>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Status</mat-label><mat-select formControlName="status"><mat-option *ngFor="let s of statuses" [value]="s.v">{{ s.l }}</mat-option></mat-select></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Start date</mat-label><input matInput type="date" formControlName="startDate"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>End date</mat-label><input matInput type="date" formControlName="endDate"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Monthly fee</mat-label><input matInput type="number" formControlName="monthlyFee"><mat-hint>In your tenant's currency.</mat-hint></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Distance (km, optional)</mat-label><input matInput type="number" formControlName="distance" step="0.1"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Pickup location</mat-label><input matInput formControlName="pickupLocation"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Pickup time (hh:mm:ss)</mat-label><input matInput formControlName="pickupTime" placeholder="07:15:00"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Drop location</mat-label><input matInput formControlName="dropLocation"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Drop time (hh:mm:ss)</mat-label><input matInput formControlName="dropTime" placeholder="16:30:00"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Conductor name</mat-label><input matInput formControlName="conductorName"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Conductor phone</mat-label><input matInput formControlName="conductorPhone"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Emergency contact</mat-label><input matInput formControlName="emergencyContact"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Emergency phone</mat-label><input matInput formControlName="emergencyPhone"></mat-form-field>
        </div>
        <mat-form-field appearance="outline" class="w-full"><mat-label>Remarks</mat-label><input matInput formControlName="remarks"></mat-form-field>
        <div class="flex justify-end gap-2 pt-2">
            <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : 'Save' }}</button>
        </div>
    </form>
</app-list-page>
