<div class="flex flex-col flex-auto min-w-0 p-6 max-w-6xl">
    <div class="mb-6">
        <h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">SMS Templates</h2>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">Reusable SMS message bodies. Phase H1 broadcast picks from this list.</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-5">
            <h3 class="text-lg font-semibold mb-3">{{ editingId ? 'Edit template' : 'New template' }}</h3>
            <form [formGroup]="form" (ngSubmit)="save()" class="space-y-2">
                <mat-form-field class="w-full"><mat-label>Title</mat-label><input matInput formControlName="title"></mat-form-field>
                <mat-form-field class="w-full"><mat-label>Message</mat-label><textarea matInput formControlName="message" rows="6"></textarea></mat-form-field>
                <div class="flex gap-2 pt-2">
                    <button mat-stroked-button type="button" (click)="reset()">Reset</button>
                    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : (editingId ? 'Save' : 'Add') }}</button>
                </div>
            </form>
        </div>
        <div class="lg:col-span-2 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
            <table mat-table [dataSource]="rows" class="w-full">
                <ng-container matColumnDef="title"><th mat-header-cell *matHeaderCellDef>Title</th><td mat-cell *matCellDef="let t" class="font-medium">{{ t.title }}</td></ng-container>
                <ng-container matColumnDef="message"><th mat-header-cell *matHeaderCellDef>Message</th><td mat-cell *matCellDef="let t" class="text-sm">{{ truncate(t.message) }}</td></ng-container>
                <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef class="!text-right">Actions</th><td mat-cell *matCellDef="let t" class="!text-right">
                    <button mat-icon-button (click)="edit(t)" matTooltip="Edit"><mat-icon class="!w-5 !h-5 !text-base">edit</mat-icon></button>
                    <button mat-icon-button color="warn" (click)="remove(t)" matTooltip="Delete"><mat-icon class="!w-5 !h-5 !text-base">delete</mat-icon></button>
                </td></ng-container>
                <tr mat-header-row *matHeaderRowDef="cols"></tr>
                <tr mat-row *matRowDef="let row; columns: cols"></tr>
            </table>
            <div *ngIf="rows.length === 0 && !loading" class="py-12 text-center text-sm text-gray-500">No SMS templates yet.</div>
        </div>
    </div>
</div>
