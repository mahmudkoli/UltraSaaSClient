<app-list-page
    [title]="editingId ? 'Edit issue' : 'Issue book'"
    subtitle="Pick a book + borrower, set due date. Fines accrue automatically past due."
    icon="local_library"
    iconGradient="from-emerald-500 to-teal-600"
    pageGradient="from-gray-50 via-emerald-50/30 to-teal-50/30">

    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-5 space-y-3">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <app-entity-picker
                label="Book"
                placeholder="Title / author / ISBN"
                formControlName="bookId"
                [searchFn]="searchBooks"
                [displayFn]="displayBook"
                [resolveFn]="resolveBook"></app-entity-picker>
            <app-entity-picker
                label="Borrower (Student)"
                placeholder="Student name or roll"
                formControlName="studentId"
                [searchFn]="searchStudents"
                [displayFn]="displayStudent"
                [resolveFn]="resolveStudent"></app-entity-picker>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Issue date</mat-label><input matInput type="date" formControlName="issueDate"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Due date</mat-label><input matInput type="date" formControlName="dueDate"></mat-form-field>
            <mat-form-field *ngIf="editingId" class="sm:col-span-2"><mat-label>Return date</mat-label><input matInput type="date" formControlName="returnDate"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full sm:col-span-2"><mat-label>Remarks</mat-label><input matInput formControlName="remarks"></mat-form-field>
        </div>
        <ng-container *ngIf="editingId">
            <div class="flex items-center gap-4">
                <mat-checkbox formControlName="isReturned">Returned</mat-checkbox>
                <mat-checkbox formControlName="isFinePaid">Fine paid</mat-checkbox>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <mat-form-field appearance="outline" class="w-full"><mat-label>Fine amount (BDT)</mat-label><input matInput type="number" formControlName="fineAmount"></mat-form-field>
                <mat-form-field appearance="outline" class="w-full"><mat-label>Fine remarks</mat-label><input matInput formControlName="fineRemarks"></mat-form-field>
            </div>
        </ng-container>
        <div class="flex justify-end gap-2 pt-2">
            <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : 'Save' }}</button>
        </div>
    </form>
</app-list-page>
