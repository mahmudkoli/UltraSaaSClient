<div class="flex flex-col flex-auto min-w-0 p-6 max-w-3xl">
    <div class="mb-6">
        <h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">{{ editingId ? 'Edit issue' : 'Issue book' }}</h2>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">Paste the Book ID and Student ID from their respective list pages. (Picker UI is a follow-up.)</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 space-y-3">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <mat-form-field><mat-label>Book ID</mat-label><input matInput formControlName="bookId" placeholder="guid"></mat-form-field>
            <mat-form-field><mat-label>Student ID</mat-label><input matInput formControlName="studentId" placeholder="guid"></mat-form-field>
            <mat-form-field><mat-label>Issue date</mat-label><input matInput type="date" formControlName="issueDate"></mat-form-field>
            <mat-form-field><mat-label>Due date</mat-label><input matInput type="date" formControlName="dueDate"></mat-form-field>
            <mat-form-field *ngIf="editingId" class="sm:col-span-2"><mat-label>Return date</mat-label><input matInput type="date" formControlName="returnDate"></mat-form-field>
            <mat-form-field class="sm:col-span-2"><mat-label>Remarks</mat-label><input matInput formControlName="remarks"></mat-form-field>
        </div>
        <ng-container *ngIf="editingId">
            <div class="flex items-center gap-4">
                <mat-checkbox formControlName="isReturned">Returned</mat-checkbox>
                <mat-checkbox formControlName="isFinePaid">Fine paid</mat-checkbox>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <mat-form-field><mat-label>Fine amount (BDT)</mat-label><input matInput type="number" formControlName="fineAmount"></mat-form-field>
                <mat-form-field><mat-label>Fine remarks</mat-label><input matInput formControlName="fineRemarks"></mat-form-field>
            </div>
        </ng-container>
        <div class="flex justify-end gap-2 pt-2">
            <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : 'Save' }}</button>
        </div>
    </form>
</div>
