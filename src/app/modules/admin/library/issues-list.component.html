<app-list-page
    title="Library — Issues"
    subtitle="Active and historical book check-outs. Use the Return action to close an issue and accrue fines."
    icon="local_library"
    iconGradient="from-emerald-500 to-teal-600"
    pageGradient="from-gray-50 via-emerald-50/30 to-teal-50/30">

    <div pageActions class="flex flex-col w-full sm:w-auto sm:flex-row sm:items-center sm:justify-end gap-3">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full sm:w-auto sm:min-w-72">
            <mat-label>Search</mat-label>
            <input matInput [formControl]="search">
            <mat-icon matSuffix class="text-gray-400">search</mat-icon>
        </mat-form-field>
        <a mat-stroked-button routerLink="/library/books" matTooltip="Catalogue">Books &rarr;</a>
        <button mat-fab color="primary" (click)="add()" matTooltip="Issue book"><mat-icon>add</mat-icon></button>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <table mat-table [dataSource]="rows" class="w-full">
            <ng-container matColumnDef="issueDate"><th mat-header-cell *matHeaderCellDef>Issued</th><td mat-cell *matCellDef="let r" class="text-xs">{{ r.issueDate | date:'mediumDate' }}</td></ng-container>
            <ng-container matColumnDef="bookTitle"><th mat-header-cell *matHeaderCellDef>Book</th><td mat-cell *matCellDef="let r" class="font-medium">{{ r.bookTitle }}</td></ng-container>
            <ng-container matColumnDef="studentName"><th mat-header-cell *matHeaderCellDef>Borrower</th><td mat-cell *matCellDef="let r">{{ r.studentName }}</td></ng-container>
            <ng-container matColumnDef="dueDate"><th mat-header-cell *matHeaderCellDef>Due</th><td mat-cell *matCellDef="let r" class="text-xs">{{ r.dueDate | date:'mediumDate' }}</td></ng-container>
            <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let r">
                <span *ngIf="r.isReturned" class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800">Returned</span>
                <span *ngIf="!r.isReturned && r.isOverdue" class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800">Overdue ({{ r.daysOverdue }}d)</span>
                <span *ngIf="!r.isReturned && !r.isOverdue" class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800">Active</span>
            </td></ng-container>
            <ng-container matColumnDef="fine"><th mat-header-cell *matHeaderCellDef class="!text-right">Fine</th><td mat-cell *matCellDef="let r" class="!text-right text-sm">
                <span *ngIf="r.fineAmount">BDT {{ r.fineAmount | number:'1.0-0' }}<span *ngIf="r.isFinePaid" class="text-green-600 text-xs ml-1">paid</span></span>
                <span *ngIf="!r.fineAmount" class="text-gray-400">—</span>
            </td></ng-container>
            <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef class="!text-right">Actions</th><td mat-cell *matCellDef="let r" class="!text-right">
                <button mat-icon-button *ngIf="!r.isReturned" (click)="markReturned(r)" matTooltip="Mark returned"><mat-icon class="!w-5 !h-5 !text-base">assignment_returned</mat-icon></button>
                <button mat-icon-button (click)="edit(r)" matTooltip="Edit"><mat-icon class="!w-5 !h-5 !text-base">edit</mat-icon></button>
            </td></ng-container>
            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let row; columns: cols"></tr>
        </table>
        <div *ngIf="rows.length === 0 && !loading" class="py-12 text-center text-sm text-gray-500">No book issues yet.</div>
        <mat-paginator [length]="total" [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50, 100]" (page)="onPage($event)"></mat-paginator>
    </div>
</app-list-page>
