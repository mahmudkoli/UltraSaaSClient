<div class="flex flex-col flex-auto min-w-0 p-6 max-w-3xl">
    <div class="mb-6">
        <h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">{{ editingId ? 'Edit book' : 'New book' }}</h2>
    </div>
    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 space-y-3">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <mat-form-field class="sm:col-span-2"><mat-label>Title</mat-label><input matInput formControlName="title"></mat-form-field>
            <mat-form-field><mat-label>Author</mat-label><input matInput formControlName="author"></mat-form-field>
            <mat-form-field><mat-label>ISBN</mat-label><input matInput formControlName="isbn"></mat-form-field>
            <mat-form-field><mat-label>Publisher</mat-label><input matInput formControlName="publisher"></mat-form-field>
            <mat-form-field><mat-label>Publication date</mat-label><input matInput type="date" formControlName="publicationDate"></mat-form-field>
            <mat-form-field><mat-label>Edition</mat-label><input matInput formControlName="edition"></mat-form-field>
            <mat-form-field><mat-label>Category</mat-label><input matInput formControlName="category"></mat-form-field>
            <mat-form-field><mat-label>Subject</mat-label><input matInput formControlName="subject"></mat-form-field>
            <mat-form-field><mat-label>Shelf location</mat-label><input matInput formControlName="location"></mat-form-field>
            <mat-form-field><mat-label>Total copies</mat-label><input matInput type="number" formControlName="totalCopies" min="0"></mat-form-field>
            <mat-form-field><mat-label>Available copies</mat-label><input matInput type="number" formControlName="availableCopies" min="0"></mat-form-field>
            <mat-form-field><mat-label>Price (BDT, optional)</mat-label><input matInput type="number" formControlName="price"></mat-form-field>
        </div>
        <mat-form-field class="w-full"><mat-label>Description</mat-label><textarea matInput formControlName="description" rows="3"></textarea></mat-form-field>
        <mat-checkbox formControlName="isActive">Active</mat-checkbox>
        <div class="flex justify-end gap-2 pt-2">
            <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : 'Save' }}</button>
        </div>
    </form>
</div>
