<app-list-page
    [title]="editingId ? 'Edit book' : 'New book'"
    subtitle="Catalogue entry: title, author, ISBN, location, available copies."
    icon="menu_book"
    iconGradient="from-emerald-500 to-teal-600"
    pageGradient="from-gray-50 via-emerald-50/30 to-teal-50/30">

    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-5 space-y-3">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <mat-form-field appearance="outline" class="w-full sm:col-span-2"><mat-label>Title</mat-label><input matInput formControlName="title"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Author</mat-label><input matInput formControlName="author"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>ISBN</mat-label><input matInput formControlName="isbn"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Publisher</mat-label><input matInput formControlName="publisher"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Publication date</mat-label><input matInput type="date" formControlName="publicationDate"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Edition</mat-label><input matInput formControlName="edition"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Category</mat-label><input matInput formControlName="category"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Subject</mat-label><input matInput formControlName="subject"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Shelf location</mat-label><input matInput formControlName="location"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Total copies</mat-label><input matInput type="number" formControlName="totalCopies" min="0"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Available copies</mat-label><input matInput type="number" formControlName="availableCopies" min="0"></mat-form-field>
            <mat-form-field appearance="outline" class="w-full"><mat-label>Price (BDT, optional)</mat-label><input matInput type="number" formControlName="price"></mat-form-field>
        </div>
        <mat-form-field appearance="outline" class="w-full"><mat-label>Description</mat-label><textarea matInput formControlName="description" rows="3"></textarea></mat-form-field>
        <mat-checkbox formControlName="isActive">Active</mat-checkbox>
        <div class="flex justify-end gap-2 pt-2">
            <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
            <button mat-flat-button color="primary" type="submit" data-testid="book-save-btn" [disabled]="form.invalid || saving">{{ saving ? 'Saving…' : 'Save' }}</button>
        </div>
    </form>
</app-list-page>
