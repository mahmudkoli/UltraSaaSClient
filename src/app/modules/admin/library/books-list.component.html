<app-list-page
    title="Library — Books"
    subtitle="Catalogue of titles available for borrowing."
    icon="menu_book"
    iconGradient="from-emerald-500 to-teal-600"
    pageGradient="from-gray-50 via-emerald-50/30 to-teal-50/30">

    <div pageActions class="flex flex-col w-full sm:w-auto sm:flex-row sm:items-center sm:justify-end gap-3">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full sm:w-auto sm:min-w-72">
            <mat-label>Search</mat-label>
            <input matInput [formControl]="search">
            <mat-icon matSuffix class="text-gray-400">search</mat-icon>
        </mat-form-field>
        <a mat-stroked-button routerLink="/library/issues" matTooltip="View issue/return ledger">Issues &rarr;</a>
        <button mat-fab color="primary" (click)="add()" matTooltip="New book"><mat-icon>add</mat-icon></button>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div *ngIf="loading"><mat-progress-bar mode="indeterminate"></mat-progress-bar></div>
        <table mat-table [dataSource]="rows" class="w-full">
            <ng-container matColumnDef="title"><th mat-header-cell *matHeaderCellDef>Title</th><td mat-cell *matCellDef="let b" class="font-medium">{{ b.title }}</td></ng-container>
            <ng-container matColumnDef="author"><th mat-header-cell *matHeaderCellDef>Author</th><td mat-cell *matCellDef="let b">{{ b.author }}</td></ng-container>
            <ng-container matColumnDef="isbn"><th mat-header-cell *matHeaderCellDef>ISBN</th><td mat-cell *matCellDef="let b" class="text-xs font-mono">{{ b.isbn }}</td></ng-container>
            <ng-container matColumnDef="availability"><th mat-header-cell *matHeaderCellDef class="!text-right">Available</th><td mat-cell *matCellDef="let b" class="!text-right text-sm">
                <span [ngClass]="b.availableCopies > 0 ? 'text-green-700' : 'text-red-700'">{{ b.availableCopies }}</span> / {{ b.totalCopies }}
            </td></ng-container>
            <ng-container matColumnDef="location"><th mat-header-cell *matHeaderCellDef>Shelf</th><td mat-cell *matCellDef="let b" class="text-xs">{{ b.location || '—' }}</td></ng-container>
            <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef class="!text-right">Actions</th><td mat-cell *matCellDef="let b" class="!text-right">
                <button mat-icon-button (click)="edit(b)" matTooltip="Edit"><mat-icon class="!w-5 !h-5 !text-base">edit</mat-icon></button>
                <button mat-icon-button color="warn" (click)="remove(b)" matTooltip="Delete"><mat-icon class="!w-5 !h-5 !text-base">delete</mat-icon></button>
            </td></ng-container>
            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let row; columns: cols"></tr>
        </table>
        <div *ngIf="rows.length === 0 && !loading" class="py-12 text-center text-sm text-gray-500">No books in the catalogue yet.</div>
        <mat-paginator [length]="total" [pageIndex]="pageIndex" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50, 100]" (page)="onPage($event)"></mat-paginator>
    </div>
</app-list-page>
