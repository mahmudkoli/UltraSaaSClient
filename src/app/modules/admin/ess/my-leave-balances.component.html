<app-list-page
    title="My Leave Balances"
    subtitle="Your leave entitlement, taken, and remaining by type and year."
    icon="beach_access"
    iconGradient="from-sky-500 to-cyan-600"
    pageGradient="from-gray-50 via-sky-50/30 to-cyan-50/30">

    <div class="relative"><mat-progress-bar *ngIf="isLoading" mode="indeterminate" class="z-20"></mat-progress-bar></div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-200 dark:border-gray-700">
        <div class="overflow-x-auto">
            <table mat-table [dataSource]="items" class="min-w-full bg-transparent">
                <ng-container matColumnDef="leaveType">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-700 font-semibold px-6 py-4 text-left">Leave Type</th>
                    <td mat-cell *matCellDef="let b" class="px-6 py-4 text-sm font-medium text-gray-900 dark:text-gray-100">{{ b.leaveTypeName || '—' }}</td>
                </ng-container>
                <ng-container matColumnDef="year">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-700 font-semibold px-6 py-4 text-left">Year</th>
                    <td mat-cell *matCellDef="let b" class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">{{ b.year }}</td>
                </ng-container>
                <ng-container matColumnDef="entitled">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-700 font-semibold px-6 py-4 text-right">Entitled</th>
                    <td mat-cell *matCellDef="let b" class="px-6 py-4 text-sm text-right text-gray-600 dark:text-gray-400">{{ b.entitled }}</td>
                </ng-container>
                <ng-container matColumnDef="taken">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-700 font-semibold px-6 py-4 text-right">Taken</th>
                    <td mat-cell *matCellDef="let b" class="px-6 py-4 text-sm text-right text-gray-600 dark:text-gray-400">{{ b.taken }}</td>
                </ng-container>
                <ng-container matColumnDef="balance">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-700 font-semibold px-6 py-4 text-right">Balance</th>
                    <td mat-cell *matCellDef="let b" class="px-6 py-4 text-right">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
                              [ngClass]="b.balance > 0 ? 'text-green-700 bg-green-100 dark:text-green-300 dark:bg-green-900/30' : 'text-red-700 bg-red-100 dark:text-red-300 dark:bg-red-900/30'">{{ b.balance }}</span>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors duration-200"></tr>
            </table>
        </div>
        <div *ngIf="!isLoading && items.length === 0" class="text-center py-16">
            <div class="text-6xl mb-4">🌴</div>
            <h3 class="text-lg font-medium text-gray-900 dark:text-gray-100 mb-2">No Leave Balances</h3>
            <p class="text-gray-500 dark:text-gray-400">Your HR admin sets your yearly leave entitlements.</p>
        </div>
    </div>
</app-list-page>
