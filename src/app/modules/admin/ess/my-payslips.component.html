<app-list-page
    title="My Payslips"
    subtitle="Your monthly payslips. Download the PDF for any period."
    icon="receipt_long"
    iconGradient="from-emerald-500 to-green-700"
    pageGradient="from-gray-50 via-emerald-50/30 to-green-50/30">

    <div class="relative"><mat-progress-bar *ngIf="isLoading" mode="indeterminate" class="z-20"></mat-progress-bar></div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-200 dark:border-gray-700">
        <div class="overflow-x-auto">
            <table mat-table [dataSource]="items" class="min-w-full bg-transparent">
                <ng-container matColumnDef="period">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-700 font-semibold px-6 py-4 text-left">Period</th>
                    <td mat-cell *matCellDef="let s" class="px-6 py-4 text-sm font-medium text-gray-900 dark:text-gray-100">{{ months[s.periodMonth] }} {{ s.periodYear }}</td>
                </ng-container>
                <ng-container matColumnDef="gross">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-700 font-semibold px-6 py-4 text-right">Gross</th>
                    <td mat-cell *matCellDef="let s" class="px-6 py-4 text-sm text-right text-gray-600 dark:text-gray-400">{{ s.grossSalary | number }}</td>
                </ng-container>
                <ng-container matColumnDef="deductions">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-700 font-semibold px-6 py-4 text-right">Deductions</th>
                    <td mat-cell *matCellDef="let s" class="px-6 py-4 text-sm text-right text-red-600 dark:text-red-400">{{ s.totalDeductions | number }}</td>
                </ng-container>
                <ng-container matColumnDef="net">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-700 font-semibold px-6 py-4 text-right">Net</th>
                    <td mat-cell *matCellDef="let s" class="px-6 py-4 text-sm text-right font-semibold text-green-700 dark:text-green-400">{{ s.netSalary | number }}</td>
                </ng-container>
                <ng-container matColumnDef="pdf">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-700 font-semibold px-6 py-4 text-right">Payslip</th>
                    <td mat-cell *matCellDef="let s" class="px-6 py-4 text-right"><button mat-icon-button (click)="download(s)" matTooltip="Download PDF" class="text-indigo-600 hover:bg-indigo-50 dark:text-indigo-400 dark:hover:bg-indigo-900/20"><mat-icon>picture_as_pdf</mat-icon></button></td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors duration-200"></tr>
            </table>
        </div>
        <div *ngIf="!isLoading && items.length === 0" class="text-center py-16">
            <div class="text-6xl mb-4">🧾</div>
            <h3 class="text-lg font-medium text-gray-900 dark:text-gray-100 mb-2">No Payslips Yet</h3>
            <p class="text-gray-500 dark:text-gray-400">Your payslips appear here once payroll is run for your account.</p>
        </div>
    </div>
</app-list-page>
