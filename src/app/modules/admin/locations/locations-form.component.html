<app-list-page
    [title]="isEditMode ? 'Edit Location' : 'Create Location'"
    subtitle="Work locations / branches employees can be assigned to."
    icon="location_on"
    iconGradient="from-emerald-500 to-teal-600"
    pageGradient="from-gray-50 via-emerald-50/30 to-teal-50/30">

    <ng-container pageActions>
        <button mat-stroked-button (click)="cancel()"><mat-icon>arrow_back</mat-icon> Back</button>
    </ng-container>

    <div class="relative">
        <mat-progress-bar *ngIf="isLoading" mode="indeterminate" class="z-20"></mat-progress-bar>
    </div>

    <div class="max-w-2xl bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 p-6">
        <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4">
            <div class="flex flex-col sm:flex-row gap-4">
                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Name</mat-label>
                    <input matInput formControlName="name" placeholder="e.g. Head Office" required>
                    <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
                    <mat-error *ngIf="form.get('name')?.hasError('maxlength')">Name is too long</mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Code</mat-label>
                    <input matInput formControlName="code" placeholder="Optional, e.g. HO">
                </mat-form-field>
            </div>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Address</mat-label>
                <textarea matInput formControlName="address" rows="2" placeholder="Optional"></textarea>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>City</mat-label>
                <input matInput formControlName="city" placeholder="Optional">
            </mat-form-field>

            <mat-checkbox *ngIf="isEditMode" formControlName="isActive" color="primary">Active</mat-checkbox>

            <div class="flex items-center justify-end gap-3 pt-2">
                <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
                <button mat-flat-button color="primary" type="submit" [disabled]="isSaving">
                    <mat-icon *ngIf="!isSaving">save</mat-icon>
                    {{ isSaving ? 'Saving…' : (isEditMode ? 'Update' : 'Create') }}
                </button>
            </div>
        </form>
    </div>
</app-list-page>
