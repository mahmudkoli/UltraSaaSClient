<!doctype html>
<html lang="en">
    <head>
        <title>UltraPOS — Multi-Vertical Point of Sale</title>
        <meta charset="utf-8">
        <meta
            name="description"
            content="UltraPOS — multi-tenant point-of-sale platform for electronics, pharmacy, and supermarket businesses.">
        <meta
            name="keywords"
            content="UltraPOS,POS,Point of Sale,Inventory,Catalog,Purchasing,Pharmacy,Electronics,Supermarket,SaaS">
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">

        <base href="/">

        <!-- Favicon — versioned to bust browser cache after the UltraEdu→UltraPOS rebrand. -->
        <link rel="icon" type="image/svg+xml" href="assets/images/logo/logo.svg?v=pos">
        <link rel="alternate icon" type="image/png" href="favicon-32x32.png?v=pos">

        <!-- Fonts -->
        <link
            href="assets/fonts/inter/inter.css"
            rel="stylesheet">

        <link
            href="https://fonts.gstatic.com"
            rel="preconnect">
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet">

        <!-- Icon fonts -->
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet">

        <!-- Splash screen styles -->
        <link
            href="assets/styles/splash-screen.css"
            rel="stylesheet">

    </head>

    <body>

        <!-- Splash screen -->
        <fuse-splash-screen>
            <img
                src="assets/images/logo/logo.svg"
                alt="UltraPOS">
            <div class="spinner">
                <div class="bounce1"></div>
                <div class="bounce2"></div>
                <div class="bounce3"></div>
            </div>
        </fuse-splash-screen>

        <!-- App root -->
        <app-root></app-root>

    </body>

</html>
